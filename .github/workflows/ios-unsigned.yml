# Builds an UNSIGNED .ipa of Short Fights on a macOS runner (re-sign it with Sideloader).
# Run it from GitHub: Actions → "iOS IPA (sin firmar)" → Run workflow, or push a tag v*.
name: iOS IPA (sin firmar)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_TAG: 4.7.2-stable          # must match the editor version used for the project
  TEMPLATES: 4.7.2.stable          # export_templates folder name for that version

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + iOS template
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates/${{ env.TEMPLATES }}
          key: godot-${{ env.GODOT_TAG }}-ios-v1

      - name: Download Godot and the iOS export template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          tdir="$HOME/Library/Application Support/Godot/export_templates/${TEMPLATES}"
          mkdir -p ~/godot "$tdir"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_TAG}_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_TAG}_export_templates.tpz"
          # The .tpz is ~1.3 GB; only the iOS template is needed.
          unzip -q -j /tmp/templates.tpz templates/ios.zip templates/version.txt -d "$tdir"
          rm /tmp/templates.tpz /tmp/godot.zip

      - name: Export Xcode project with Godot
        run: |
          set -euo pipefail
          GODOT=~/godot/Godot.app/Contents/MacOS/Godot
          # Godot's iOS exporter wants a team id; the app is built unsigned and Sideloader re-signs it.
          sed -i '' 's#^application/app_store_team_id=""#application/app_store_team_id="ABCDE12345"#' export_presets.cfg
          mkdir -p build/ios
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --export-release "iOS" build/ios/ShortFights.ipa
          ls build/ios

      - name: Build unsigned app (xcodebuild)
        run: |
          set -euo pipefail
          proj=$(find build/ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          [ -n "$proj" ] || { echo "No .xcodeproj exported"; exit 1; }
          name=$(basename "$proj" .xcodeproj)
          xcodebuild -project "$proj" -scheme "$name" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "build/$name.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            > build/xcodebuild.log 2>&1 || { tail -n 80 build/xcodebuild.log; exit 1; }
          tail -n 5 build/xcodebuild.log

      - name: Package .ipa
        run: |
          set -euo pipefail
          app=$(find build/*.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          [ -n "$app" ] || { echo "No .app in the archive"; exit 1; }
          rm -rf build/Payload && mkdir build/Payload
          cp -R "$app" build/Payload/
          (cd build && zip -qry ShortFights-unsigned.ipa Payload)
          ls -lh build/ShortFights-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ShortFights-unsigned-ipa
          path: build/ShortFights-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
